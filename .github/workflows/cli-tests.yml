name: CLI tests

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-tests.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke (stdlib-only, no install)
        run: |
          python smoke.py
          python smoke_fix.py

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: CLI sanity check
        run: |
          parallelogram --help
          parallelogram check examples/clean.jsonl
          parallelogram check examples/sharegpt_clean.jsonl
          # broken.jsonl must exit 2 (errors)
          set +e; parallelogram check examples/broken.jsonl; code=$?; set -e
          test "$code" -eq 2

      - name: CLI sanity check (--fix)
        run: |
          # --fix on broken.jsonl drops unfixable records and emits the rest (exit 1)
          set +e
          parallelogram check examples/broken.jsonl --fix --dry-run; a=$?
          parallelogram check examples/broken.jsonl --fix --output /tmp/cleaned.jsonl; b=$?
          set -e
          test "$a" -eq 1 && test "$b" -eq 1
          test -s /tmp/cleaned.jsonl
          # The repaired output must itself validate clean
          parallelogram check /tmp/cleaned.jsonl
