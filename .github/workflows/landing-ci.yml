name: Landing site checks

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/check_csp.py"
      - "scripts/build_agent_view.py"
      - "scripts/build_shared.py"
      - "cli/src/parallelogram/__init__.py"
      - ".github/workflows/landing-ci.yml"
  pull_request:
    paths:
      - "landing/**"
      - "scripts/check_csp.py"
      - "scripts/build_agent_view.py"
      - "scripts/build_shared.py"
      - "cli/src/parallelogram/__init__.py"
      - ".github/workflows/landing-ci.yml"

permissions:
  contents: read

jobs:
  csp:
    name: CSP consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check every loaded resource against the CSP in vercel.json
        run: python scripts/check_csp.py

      - name: Check the Agent view matches landing/index.md
        run: python scripts/build_agent_view.py --check

      - name: Check the shared header and footer are current on every page
        run: python scripts/build_shared.py --check
