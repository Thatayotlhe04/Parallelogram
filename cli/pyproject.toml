[project]
name = "parallelogram"
dynamic = ["version"]
description = "Strict validator for fine-tuning datasets. Run before you train."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Thatayotlhe Tsenang", email = "tsenangthatayotlhe04@gmail.com" }]
maintainers = [{ name = "Thatayotlhe Tsenang", email = "tsenangthatayotlhe04@gmail.com" }]
keywords = ["llm", "fine-tuning", "dataset", "validation", "linter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.15", "tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
parallelogram = "parallelogram.cli:app"

[project.urls]
Homepage = "https://parallelogram.dev"
Source = "https://github.com/Thatayotlhe04/Parallelogram"
Documentation = "https://github.com/Thatayotlhe04/Parallelogram/blob/main/cli/docs/agents.md"
Changelog = "https://github.com/Thatayotlhe04/Parallelogram/blob/main/cli/CHANGELOG.md"
Issues = "https://github.com/Thatayotlhe04/Parallelogram/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallelogram"]

[tool.hatch.version]
path = "src/parallelogram/__init__.py"
